name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kargah
          POSTGRES_PASSWORD: kargah
          POSTGRES_DB: kargah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kargah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kargah:kargah@localhost:5432/kargah_test?schema=public
      JWT_SECRET: ci-secret-do-not-use-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter api exec prisma generate

      - name: Run API unit tests
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build

      - name: Check NLP syntax
        run: |
          python -m py_compile apps/nlp/app/main.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NLP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/nlp/Dockerfile
          push: false
          tags: kargah-nlp:ci

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: kargah-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: kargah-web:ci
