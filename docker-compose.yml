version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kargah
      POSTGRES_PASSWORD: kargah
      POSTGRES_DB: kargah
    ports:
      - "12590:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kargah"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "12588:12588"
    environment:
      DATABASE_URL: postgresql://kargah:kargah@postgres:5432/kargah
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_PORT: 12588
      NLP_URL: http://nlp:12589
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "12587:12587"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:12588
    depends_on:
      - api
    restart: unless-stopped

  nlp:
    build:
      context: .
      dockerfile: apps/nlp/Dockerfile
    ports:
      - "12589:12589"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/kargah.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - nlp
    restart: unless-stopped

volumes:
  pgdata:
